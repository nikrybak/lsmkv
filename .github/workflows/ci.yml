name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: test
        run: go test -count=1 ./...
      - name: test with race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: fuzz block decoder
        run: go test -run='^$' -fuzz=FuzzBlockDecode -fuzztime=30s ./internal/sstable
      - name: fuzz table open
        run: go test -run='^$' -fuzz=FuzzTableOpen -fuzztime=30s ./internal/sstable
      - name: fuzz WAL replay
        run: go test -run='^$' -fuzz=FuzzWALReplay -fuzztime=30s ./internal/wal
      - name: fuzz batch decoder
        run: go test -run='^$' -fuzz=FuzzBatchDecode -fuzztime=30s .

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: benchmarks (smoke)
        run: go test -run='^$' -bench=. -benchtime=100x ./...
